name: Secret Scan

# Escanea en busca de secretos filtrados (claves, tokens, credenciales) en cada push/PR.
# En push a main/develop escanea el historial completo (fetch-depth: 0); en PR, los commits del PR.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Historial completo para detectar secretos en commits pasados, no solo en el diff.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repos de organización requieren un GITLEAKS_LICENSE (gratuito). Cuenta personal / repo
          # público no lo necesita. Si el repo es de una org, agregar el secret y descomentar:
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
